schema {
  query: Query
  mutation: Mutation
}

type ActionItemOutput {
  atMs: Int
  createdAt: DateTime!
  dueDate: DateTime
  id: ID!
  isDone: Boolean!
  meetingId: ID!
  meetingTitle: String
  speakerIndex: Int
  text: String!
}

type AuthPayload {
  accessToken: String!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type KeyPointOutput {
  atMs: Int
  id: ID!
  meetingId: ID!
  order: Int!
  text: String!
}

type MeetingOutput {
  audioUrl: String
  createdAt: DateTime!
  durationSec: Int
  endedAt: DateTime
  id: ID!
  source: String
  startedAt: DateTime!
  status: MeetingStatus!
  title: String
  updatedAt: DateTime!
}

enum MeetingStatus {
  FAILED
  READY
  RECORDING
  SUMMARIZING
  TRANSCRIBING
}

type Mutation {
  meetingDelete(id: ID!): MeetingOutput!
  meetingUploadAudio(file: Upload!): MeetingOutput!
  signIn(input: SignInInput!): AuthPayload!
  signUp(input: SignUpInput!): AuthPayload!
  toggleActionItem(id: ID!): Boolean!
}

type Query {
  actionItems: [ActionItemOutput!]!
  meeting(id: ID!): MeetingOutput!
  meetingActionItems(meetingId: ID!): [ActionItemOutput!]!
  meetingKeyPoints(meetingId: ID!): [KeyPointOutput!]!
  meetingTranscript(meetingId: ID!): [TranscriptSegmentOutput!]!
  meetings: [MeetingOutput!]!
  userMe: UserMeOutput!
}

input SignInInput {
  email: String!
  password: String!
}

input SignUpInput {
  email: String!
  password: String!
}

type TranscriptSegmentOutput {
  endMs: Int!
  id: ID!
  meetingId: ID!
  speakerIndex: Int!
  startMs: Int!
  text: String!
}

"""The `Upload` scalar type represents a file upload."""
scalar Upload

type UserMeOutput {
  avatar: String
  createdAt: DateTime!
  email: String!
  id: ID!
  name: String!
  updatedAt: DateTime!
}