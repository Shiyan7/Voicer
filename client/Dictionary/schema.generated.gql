schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

type ActionItemOutput {
  atMs: Int
  createdAt: DateTime!
  dueDate: DateTime
  id: ID!
  isDone: Boolean!
  meetingId: ID!
  meetingSource: String
  meetingStartedAt: DateTime!
  meetingTitle: String
  speakerIndex: Int
  text: String!
}

type AuthPayload {
  accessToken: String!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

type KeyPointOutput {
  atMs: Int
  id: ID!
  meetingId: ID!
  order: Int!
  text: String!
}

type MeetingOutput {
  audioUrl: String
  createdAt: DateTime!
  durationSec: Int
  endedAt: DateTime
  id: ID!
  isFavorite: Boolean!
  source: String
  startedAt: DateTime!
  status: MeetingStatus!
  summarizationFailed: Boolean!
  title: String
  updatedAt: DateTime!
}

enum MeetingStatus {
  FAILED
  READY
  RECORDING
  SUMMARIZING
  TRANSCRIBED
  TRANSCRIBING
}

input MeetingsPageInput {
  favoritesOnly: Boolean! = false
  limit: Int! = 10
  page: Int! = 1
  sort: MeetingsSort! = DATE_DESC
  sources: [String!]
}

type MeetingsPageOutput {
  items: [MeetingOutput!]!
  meta: PagePaginationMetaOutput!
}

enum MeetingsSort {
  DATE_ASC
  DATE_DESC
  DURATION_ASC
  DURATION_DESC
}

type MeetingsStatsOutput {
  openActionItems: Int!
  sources: [String!]!
  weekCount: Int!
  weekDurationSec: Int!
}

type Mutation {
  meetingDelete(id: ID!): MeetingOutput!
  meetingRename(id: ID!, title: String): MeetingOutput!
  meetingSetFavorite(id: ID!, isFavorite: Boolean!): MeetingOutput!
  meetingSuggestTitle(id: ID!): String!
  meetingSummarize(id: ID!): MeetingOutput!
  meetingUploadAudio(file: Upload!, source: String, startedAt: DateTime): MeetingOutput!
  signIn(input: SignInInput!): AuthPayload!
  signUp(input: SignUpInput!): AuthPayload!
  toggleActionItem(id: ID!): Boolean!
}

type PagePaginationMetaOutput {
  hasNextItems: Boolean!
  hasPrevItems: Boolean!
  page: Int!
  total: Int!
}

type Query {
  actionItems: [ActionItemOutput!]!
  meeting(id: ID!): MeetingOutput!
  meetingActionItems(meetingId: ID!): [ActionItemOutput!]!
  meetingKeyPoints(meetingId: ID!): [KeyPointOutput!]!
  meetingTranscript(meetingId: ID!): [TranscriptSegmentOutput!]!
  meetingsPage(input: MeetingsPageInput!): MeetingsPageOutput!
  meetingsStats: MeetingsStatsOutput!
  search(input: SearchInput!): SearchPageOutput!
  statsDayMeetings(input: StatsDayMeetingsInput!): [StatsDayMeetingOutput!]!
  statsSummary(input: StatsSummaryInput!): StatsSummaryOutput!
  statsYear(input: StatsYearInput!): StatsYearOutput!
  userMe: UserMeOutput!
}

input SearchInput {
  limit: Int! = 30
  offset: Int! = 0
  query: String!
  sort: SearchSort! = RELEVANCE
}

enum SearchMatchKind {
  ACTION_ITEM
  KEY_POINT
  SOURCE
  TRANSCRIPT
}

type SearchPageOutput {
  items: [SearchResultOutput!]!
  total: Int!
}

type SearchResultOutput {
  atMs: Int
  durationSec: Int
  kind: SearchMatchKind!
  matchCount: Int!
  matchId: ID!
  meetingId: ID!
  source: String
  startedAt: DateTime!
  text: String!
  title: String
}

enum SearchSort {
  RECENT
  RELEVANCE
}

input SignInInput {
  email: String!
  password: String!
}

input SignUpInput {
  email: String!
  password: String!
}

type StatsCalendarDayOutput {
  count: Int!
  date: String!
  durationSec: Int!
}

type StatsDayMeetingOutput {
  durationSec: Int
  id: ID!
  source: String
  startedAt: DateTime!
  title: String
}

input StatsDayMeetingsInput {
  date: String!
  timeZone: String!
}

type StatsSourceOutput {
  count: Int!
  durationSec: Int!
  source: String
}

input StatsSummaryInput {
  timeZone: String!
}

type StatsSummaryOutput {
  activeDays: Int!
  count: Int!
  durationSec: Int!
  longestStreak: Int!
  years: [Int!]!
}

input StatsYearInput {
  timeZone: String!
  year: Int!
}

type StatsYearOutput {
  days: [StatsCalendarDayOutput!]!
  sources: [StatsSourceOutput!]!
}

type Subscription {
  meetingUpdated(id: ID!): MeetingOutput!
}

type TranscriptSegmentOutput {
  endMs: Int!
  id: ID!
  meetingId: ID!
  speakerIndex: Int!
  startMs: Int!
  text: String!
}

"""The `Upload` scalar type represents a file upload."""
scalar Upload

type UserMeOutput {
  avatar: String
  createdAt: DateTime!
  email: String!
  id: ID!
  name: String!
  updatedAt: DateTime!
}